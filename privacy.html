<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プライバシーポリシー | Atta</title><style>body{margin:0;background:#fbf6ef;color:#202632;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.8}.inner{width:min(880px,calc(100% - 40px));margin:0 auto;padding:56px 0}.logo{width:132px}a{color:inherit}.card{background:#fff;border:1px solid #eadfd2;border-radius:20px;padding:28px;box-shadow:0 10px 28px rgba(32,38,50,.07)}h1{font-size:40px;line-height:1.2}</style></head><body><main class="inner"><a href="/"><img class="logo" src="/atta-logo-wordmark-transparent.png" alt="Atta"></a><div class="card"><h1>プライバシーポリシー</h1><p>Atta は、地域情報の投稿・確認・報告に必要な範囲で、アカウント情報、投稿写真、位置情報、端末情報、広告視聴・開示・報告に関する記録を取り扱います。</p><h2>利用目的</h2><p>投稿作成、広告開示、ナカッタ報告、本人確認、問い合わせ対応、不正防止、サービス改善に利用します。</p><h2>位置情報</h2><p>正確な場所は開示対象の情報として慎重に扱い、開示前には伏せ字・要約・大まかなエリア表示に制限します。</p><h2>第三者提供</h2><p>法令に基づく場合、決済・広告・認証・ストレージ等の委託先に必要な範囲で提供する場合を除き、本人の同意なく第三者提供しません。</p></div></main></body></html>
